name: Deploy to Azure App Service

# Builds, tests and deploys Siel Cart to Azure App Service (Linux, PHP 8.2).
# Every step must pass before the package is built, and the package must be
# built before anything is deployed -- a failed test, build, platform check,
# certificate preflight or Nginx drift check stops the run with nothing sent
# to Azure. See docs/azure-deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  # Vite 7 needs Node 20.19+ or 22.12+.
  NODE_VERSION: '22'
  AZURE_WEBAPP_NAME: 'sielcart'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      ## Cheap checks first, so a run that can never deploy fails in seconds.
      - name: Check nginx.conf matches the canonical default site
        run: |
          if ! cmp --silent default nginx.conf; then
            echo "::error file=nginx.conf::nginx.conf has drifted from default. Edit default and copy it to nginx.conf."
            exit 1
          fi

      #- name: Check the Aiven CA certificate is present
      #  run: |
       #   if [ ! -r storage/certs/aiven-ca.pem ]; then
       #     echo "::error file=storage/certs/README.md::storage/certs/aiven-ca.pem is missing or unreadable. Download the genuine CA from the Aiven console and commit it (see storage/certs/README.md)."
       #     exit 1
       #   fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, exif, pcntl, gd, zip, intl, fileinfo, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install Dependencies & Build Assets
  run: |
    composer install --no-dev --optimize-autoloader
    npm ci
    npm run build
    

      # phpunit.xml pins the test database (sqlite :memory:), mail, cache,
      # queue and session drivers; the .env only has to supply an APP_KEY.
      # The key is generated for this run and never leaves the runner.
      - name: Prepare a throwaway CI environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Run the test suite
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Replaces the dev install in place: removes dev packages and rebuilds
      # an optimized autoloader and bootstrap/cache package manifests.
      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Remove the CI environment file
        run: rm -f .env

      # One -x per pattern; zip wildcards match across directories, so
      # '*/node_modules/*' and '*/.env*' cover every nested copy.
      # bootstrap/cache is kept: it holds the production package manifests.
      - name: Package the release
        run: |
          zip -r -q ../release.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'tests/*' \
            -x 'node_modules/*' \
            -x '*/node_modules/*' \
            -x '.env' \
            -x '.env.*' \
            -x '*/.env' \
            -x '*/.env.*' \
            -x 'storage/logs/*' \
            -x 'storage/framework/cache/data/*' \
            -x 'storage/framework/sessions/*' \
            -x 'storage/framework/views/*' \
            -x 'storage/framework/testing/*' \
            -x 'public/hot' \
            -x 'public/storage' \
            -x 'public/storage/*' \
            -x '.phpunit.cache/*' \
            -x '.phpunit.result.cache' \
            -x '.claude/*'
          ls -lh ../release.zip

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ../release.zip

      # F1 has no Always On, so the first request after a deploy waits for a
      # cold start (and for migrations, when enabled). /up proves Laravel
      # boots; /products proves a database-backed page renders.
      - name: Smoke test the deployment
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          base_url="${APP_URL%/}"
          base_url="https://${base_url#*://}"

          check() {
            local url="${base_url}$1"
            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error --location --max-time 30 --output /dev/null "$url"; then
                echo "OK: $url"
                return 0
              fi
              echo "Attempt ${attempt}/10 failed for $url; retrying in 30 seconds."
              sleep 30
            done
            echo "::error::$url never returned a successful response."
            return 1
          }

          check /up
          check /products
