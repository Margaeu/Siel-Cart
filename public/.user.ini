; PHP-FPM per-directory limits for Azure App Service (Linux).
;
; Uploads are capped at 10 MB per file by Livewire's temporary-upload rule and
; the application's validation rules (max:10240). upload_max_filesize leaves a
; little headroom over that so Laravel, not PHP, produces the error message.
; post_max_size covers one Livewire request carrying up to five 10 MB review
; photos plus multipart overhead, and matches client_max_body_size in the
; Nginx `default` site. Livewire invalidates an upload after 5 minutes, which
; is what the 300-second input/execution limits line up with.
;
; Nginx denies requests for this file (hidden-file rule). If Azure ever stops
; honouring .user.ini, set the same values through the PHP_INI_SCAN_DIR app
; setting instead -- see docs/azure-deployment.md.

upload_max_filesize=12M
post_max_size=64M
max_file_uploads=20
max_input_time=300
max_execution_time=300
memory_limit=256M
